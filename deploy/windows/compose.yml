services:
  dashboard:
    build:
      context: ../..
    image: onyx-and-ink-staff:latest
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ONYX_CLOUD_MODE: "false"
      ONYX_WINDOWS_DOCKER: "true"
      ONYX_BIND_HOST: "0.0.0.0"
      PORT: "8765"
    ports:
      # A single bind serves localhost and the LAN address. Publishing the same
      # container port twice is unreliable on Docker Desktop for Windows.
      - "8765:8765"
    volumes:
      - ../../.env:/app/.env
      - ../../google-oauth-client.json:/app/google-oauth-client.json:ro
      - ../../work:/app/work
      - ../../reports:/app/reports
      - ../../cloudflare-storefront:/app/storefront:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
