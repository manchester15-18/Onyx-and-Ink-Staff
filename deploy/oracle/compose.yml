services:
  dashboard:
    build:
      context: /opt/onyx/app
    image: onyx-and-ink-staff:latest
    restart: unless-stopped
    env_file:
      - /opt/onyx/secrets/app.env
    environment:
      ONYX_CLOUD_MODE: "true"
      ONYX_BIND_HOST: "0.0.0.0"
      PORT: "8765"
    volumes:
      - /opt/onyx/secrets/app.env:/app/.env
      - /opt/onyx/secrets/google-oauth-client.json:/app/google-oauth-client.json:ro
      - /opt/onyx/data/work:/app/work
      - /opt/onyx/data/reports:/app/reports
    expose:
      - "8765"
    networks:
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - /opt/onyx/secrets/cloudflared.env
    command: tunnel --no-autoupdate run
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - private

networks:
  private:
    driver: bridge
